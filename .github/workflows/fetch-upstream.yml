name: Sync fork with upstream Repository
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Sync master from upstream (exclude .github)
        env:
          TARGET_BRANCH: master
          UPSTREAM_REPO: iptv-org/epg
          UPSTREAM_BRANCH: master
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          git checkout "${TARGET_BRANCH}"
          git fetch upstream "${UPSTREAM_BRANCH}"

          # Create a merge state that records upstream history without touching files.
          git merge --no-commit -s ours "upstream/${UPSTREAM_BRANCH}"
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Already up to date."
            exit 0
          fi

          # Bring in upstream changes for all paths except .github.
          git checkout "upstream/${UPSTREAM_BRANCH}" -- . ':(exclude).github'

          git add -A
          git commit -m "chore: sync upstream (exclude .github)"
          git push
